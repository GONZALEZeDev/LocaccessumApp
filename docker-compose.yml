services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Locaccessum.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      Jwt__Secret: ${Jwt__Secret}
      Jwt__LifetimeHours: ${Jwt__LifetimeHours}
      InternalApiKey: ${InternalApiKey}
      Cors__FrontOrigin: ${Cors__FrontOrigin}
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"

  worker:
    build:
      context: ./worker
    depends_on:
      api:
        condition: service_started
    environment:
      API_BASE_URL: http://api:8080
      INTERNAL_API_KEY: ${InternalApiKey}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      REMINDER_WINDOW_HOURS: ${REMINDER_WINDOW_HOURS:-24}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 * * * *}
    restart: unless-stopped

volumes:
  pgdata:
