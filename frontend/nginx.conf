server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Baseline hardening headers (security review finding: none of these were sent at all).
  # script-src/style-src are 'self' only — the built SPA has no inline scripts/styles and loads
  # nothing from a CDN; connect-src is left open since VITE_API_BASE_URL is a build-time arg this
  # static config can't see, and it's the only thing that would otherwise need naming here.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src *; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  # Ignored by browsers over plain HTTP; takes effect once this sits behind a TLS reverse proxy.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # SPA fallback: any path that isn't a real file resolves to index.html,
  # so client-side routes (e.g. a hard refresh on /profile) don't 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
